name: Accessibility contrast

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run WCAG AA contrast check
        run: node scripts/check-contrast.mjs
